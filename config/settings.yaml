# Modular RAG MCP Server - Configuration
# This is the main configuration file for the MCP Server.
# Edit this file to configure LLM, Embedding, VectorStore, and other services.

llm:
  provider: "openai"        # openai | azure | ollama | deepseek
  model: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 2048
  # Optional connection settings. When unset, providers fall back to env vars:
  # OPENAI_API_KEY / DEEPSEEK_API_KEY / AZURE_OPENAI_API_KEY / AZURE_OPENAI_ENDPOINT.
  # Values support ${ENV_VAR} references.
  # api_key: "${OPENAI_API_KEY}"
  # base_url: "https://api.openai.com/v1"   # custom OpenAI-compatible endpoint
  # azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"  # azure only
  # api_version: "2024-06-01"                   # azure only
  # deployment_name: "gpt-4o-mini"              # azure only

embedding:
  provider: "openai"        # openai | azure | ollama
  model: "text-embedding-3-small"
  dimensions: 1536           # text-embedding-3-small=1536, ada-002=1536, large=3072
  # Optional connection settings (same rules as llm section; ${ENV_VAR} supported).
  # api_key: "${OPENAI_API_KEY}"
  # base_url: "https://api.openai.com/v1"       # custom OpenAI-compatible endpoint
  # azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"  # azure only
  # api_version: "2024-06-01"                   # azure only
  # deployment_name: "text-embedding-ada-002"   # azure only
  # Oversize-input policy: unset = no limit; with a limit, longer texts raise
  # unless truncate_oversize is true.
  # max_input_chars: 8000
  # truncate_oversize: false

vector_store:
  provider: "chroma"        # chroma
  persist_directory: "data/db/chroma"
  collection_name: "default"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10           # top-k after RRF fusion, before rerank
  rrf_k: 60

rerank:
  enabled: false
  provider: "none"          # none | cross_encoder | llm
  model: "none"             # model name for cross_encoder or llm reranker
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"        # custom | ragas | deepeval
  metrics:
    - "hit_rate"
    - "mrr"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "logs/traces.jsonl"
  structured_logging: false

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"     # recursive | semantic | fixed
  batch_size: 16
